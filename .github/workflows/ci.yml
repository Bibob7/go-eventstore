name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint (core module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: golangci-lint (integration/mysql)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: integration/mysql

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test core module
        run: go test ./...

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run benchmarks (core module)
        # -run=^$ skips the unit tests (covered by the Unit Tests job);
        # -benchtime=1x runs each benchmark once so this stays a fast
        # smoke check that they compile and execute without failing.
        run: go test -run=^$ -bench=. -benchmem -benchtime=1x ./...

  benchmark-compare:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    # Only meaningful on PRs: compares the PR head against its base branch.
    # Runs are interleaved (head/base alternating) so both see the same
    # shared-runner drift and benchstat compares like with like.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    env:
      # Tunables. BENCH_COUNT must be >= 6 for benchstat to compute a
      # confidence interval; more samples damp shared-runner noise. BENCH_PKG
      # limits the run to the package that actually holds benchmarks.
      BENCH_COUNT: "10"
      BENCH_TIME: "1s"
      BENCH_PKG: "."
      # Fail the job when a benchmark is statistically significantly slower
      # (benchstat p < 0.05) than base by more than this percent (time/op).
      REGRESSION_PCT: "20"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Build benchmark binaries (head and base)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          go test -run=^$ -c -o "${RUNNER_TEMP}/head.test" "${BENCH_PKG}"
          git checkout --quiet --detach "${BASE_SHA}"
          go test -run=^$ -c -o "${RUNNER_TEMP}/base.test" "${BENCH_PKG}"
          git checkout --quiet --force -

      - name: Interleaved benchmark
        run: |
          : > head.txt
          : > base.txt
          for _ in $(seq 1 "${BENCH_COUNT}"); do
            "${RUNNER_TEMP}/head.test" -test.run='^$' -test.bench=. -test.benchmem -test.benchtime="${BENCH_TIME}" -test.count=1 >> head.txt
            "${RUNNER_TEMP}/base.test" -test.run='^$' -test.bench=. -test.benchmem -test.benchtime="${BENCH_TIME}" -test.count=1 >> base.txt
          done

      - name: Compare with benchstat
        run: |
          benchstat base.txt head.txt | tee comparison.txt
          benchstat -format csv base.txt head.txt > comparison.csv 2>/dev/null || true

      - name: Post comparison as PR comment
        # Fork PRs get a read-only token and cannot comment; the regression
        # gate below still runs and surfaces failures as a red check.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- benchstat-report -->';
            const base = context.payload.pull_request.base.ref;
            const body = marker + '\n' +
              '## 📊 Benchmark vs `' + base + '`\n\n' +
              '<sub>n=' + process.env.BENCH_COUNT + ', benchtime=' + process.env.BENCH_TIME +
              ' — shared CI runner, treat absolute numbers as noisy. A row shows a' +
              ' percentage only when the change is statistically significant' +
              ' (p &lt; 0.05).</sub>\n\n' +
              '```\n' + fs.readFileSync('comparison.txt', 'utf8').trim() + '\n```';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Gate on time/op regression
        run: |
          # Gate on the suite geomean of the sec/op table, not individual
          # benchmarks: per-benchmark deltas are too noisy on shared runners
          # (the per-bench numbers are still posted in the PR comment). B/op
          # and allocs/op are reported but not gated.
          awk -F, -v thresh="${REGRESSION_PCT}" '
            $2 == "sec/op" { insec = 1; next }
            insec && NF < 2 { insec = 0 }
            insec && $1 == "geomean" {
              pct = $6; gsub(/[+%]/, "", pct);
              if (pct ~ /^[0-9.]+$/ && pct + 0 > thresh + 0) {
                printf "  geomean %s slower\n", $6;
                bad = 1;
              }
              insec = 0;
            }
            END {
              if (bad) {
                print "::error::Benchmark suite geomean time/op regression exceeds " thresh "% (vs base)";
                exit 1;
              }
              print "No geomean time/op regression beyond " thresh "%.";
            }
          ' comparison.csv

  integration-tests:
    name: Integration Tests (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: su-photography
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test integration/mysql module
        working-directory: integration/mysql
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: su-photography
        run: go test ./...
